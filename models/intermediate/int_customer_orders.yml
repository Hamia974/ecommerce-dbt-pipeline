version: 2

models:
  - name: int_customer_orders
    description: "Aggregated customer-level order metrics calculated from staged orders."

    columns:
      - name: customer_id
        description: "Unique identifier of the customer."

      - name: customer_name
        description: "Name of the customer."

      - name: total_orders
        description: "Total number of completed orders placed by the customer."

      - name: total_revenue
        description: "Total revenue generated by the customer."

      - name: average_order_value
        description: "Average revenue per completed order for the customer."