version: 2

models:
  - name: stg_orders
    description: "Cleaned and filtered completed e-commerce orders from the source orders table."

    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - not_null
          - unique

      - name: order_date
        description: "Date on which the order was placed."

      - name: customer_id
        description: "Unique identifier of the customer."
        data_tests:
          - not_null

      - name: customer_name
        description: "Name of the customer."

      - name: product_id
        description: "Unique identifier of the purchased product."

      - name: product
        description: "Name of the purchased product."

      - name: category
        description: "Product category."

      - name: unit_price
        description: "Price of one unit of the product."

      - name: quantity
        description: "Number of units purchased."

      - name: status
        description: "Order status."

      - name: city
        description: "Customer city."

      - name: revenue
        description: "Total revenue generated by the order."
        data_tests:
          - not_null