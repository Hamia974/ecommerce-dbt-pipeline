version: 2

models:
  - name: customer_revenue
    description: "Final customer-level revenue mart designed for analytics and business reporting."

    columns:
      - name: customer_id
        description: "Unique identifier of the customer."

      - name: customer_name
        description: "Name of the customer."

      - name: total_orders
        description: "Total number of completed orders."

      - name: total_revenue
        description: "Total revenue generated by the customer."

      - name: average_order_value
        description: "Average revenue generated per order."